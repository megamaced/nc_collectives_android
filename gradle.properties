org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableR8.fullMode=true

kotlin.code.style=official
ksp.incremental=true

# Gradle Managed Device rendering, for :baselineprofile's generation run
# (R-64). Only the GMD emulator reads this; nothing else in the build changes.
#
# AGP 8.13 launches a managed device with `-gpu auto-no-window`, an option
# emulator 37.x has dropped: it logs `Selected GPU option 'auto-no-window' is
# not valid, switching to 'auto' mode`, and `auto` then goes looking for a
# host GPU that a headless run has no business needing. Naming the software
# renderer sidesteps the dropped option. Generation does not need real GPU
# rendering — it records which code paths run, not how fast they draw.

android.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
