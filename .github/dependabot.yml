version: 2

updates:
  # Reads gradle/libs.versions.toml (the version catalog), the build scripts,
  # and the Gradle wrapper.
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    labels:
      - dependencies
    # A dependency lands in the first group it matches, so the catch-all is last.
    groups:
      # AGP, Kotlin, KSP and Hilt only work as a matched set — bumping one
      # without the others produces a PR that cannot build, so they share a
      # single PR that either goes green or does not. Majors included: a
      # dependency lands in the first group it matches, so excluding them
      # here does not hold a major back, it just drops it into the
      # catch-all PR alongside unrelated libraries.
      build-toolchain:
        patterns:
          - "com.android.tools.build:*"
          - "com.android.application*"
          - "com.android.library*"
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
          - "com.google.dagger:*"
          - "org.jlleitschuh.gradle*"
        update-types:
          - major
          - minor
          - patch
      # Jetpack moves in lockstep often enough that one PR per week is saner
      # than a dozen; the Compose BOM lives here too.
      androidx-jetpack:
        patterns:
          - "androidx.*"
      everything-else:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/London
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
