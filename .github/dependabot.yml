version: 2

updates:
  # Reads gradle/libs.versions.toml (the version catalog) as well as the
  # build scripts. The Gradle wrapper itself is not covered by Dependabot and
  # stays a manual bump alongside AGP.
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    labels:
      - dependencies
    # A dependency lands in the first group it matches, so the catch-all is last.
    groups:
      # AGP, Kotlin, KSP and Hilt only work as a matched set — bumping one
      # without the others produces a PR that cannot build, so they share a
      # single PR that either goes green or does not.
      build-toolchain:
        patterns:
          - "com.android.tools.build:*"
          - "com.android.application*"
          - "com.android.library*"
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
          - "com.google.dagger:*"
          - "org.jlleitschuh.gradle*"
        update-types:
          - minor
          - patch
      # Jetpack moves in lockstep often enough that one PR per week is saner
      # than a dozen; the Compose BOM lives here too.
      androidx-jetpack:
        patterns:
          - "androidx.*"
      everything-else:
        patterns:
          - "*"
    ignore:
      # Deliberate pin, documented in gradle/libs.versions.toml: the project
      # is on AGP 8.13.2 with Gradle 8.14.4. AGP 9 needs a Gradle upgrade and
      # drags Hilt with it, so the major is a deliberate manual decision.
      - dependency-name: "com.android.tools.build:gradle"
        update-types:
          - version-update:semver-major
      - dependency-name: "com.android.application*"
        update-types:
          - version-update:semver-major
      # Hilt is held at 2.58 because 2.59+ requires AGP 9. Unblock this at the
      # same time as the AGP major above, not before.
      - dependency-name: "com.google.dagger:*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/London
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
